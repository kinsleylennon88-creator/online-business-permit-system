                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>

                    </div>

                        <span class="government-seal-name">Municipality of Janiuay</span>
                        <span class="government-seal-dept">Business Permits & Licensing Office</span>
                    </div>
                </div>

                <h1 style="font-family: var(--font-heading); font-size: 1.75rem; margin-bottom: 0.5rem;">Business Permit Application</h1>
                <p style="color: var(--gray-600); margin-bottom: 2rem;">Complete this step-by-step form to apply for your business permit</p>

                <!-- Wizard Container -->
                <div id="permitWizard"></div>
            </div>
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>

    <script src="/js/tracker-checklist.js"></script>
    <script src="/js/privacy-footer.js"></script>

        // Check authentication
        if (!auth.isAuthenticated()) {
            window.location.href = '/login.html';
        }
        
        // Load user data
        const user = auth.getUser();
        if (user) {
            document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
        }
        
        // Setup logout
        document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

                            </div>
                        </div>
                        
                        <div class="documents-progress" style="margin-top: 24px; padding: 16px; background: #f8fafc; border-radius: 12px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="font-weight: 600; color: var(--gray-700);">Required Documents</span>
                                <span id="docsProgress" style="font-weight: 700; color: var(--primary);">0/5 uploaded</span>
                            </div>
                            <div class="progress-bar" style="height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
                                <div id="docsProgressBar" style="height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease;"></div>
                            </div>
                            <p style="color: var(--gray-500); font-size: 0.875rem; margin-top: 8px;">All required documents must be uploaded before submitting.</p>
                        </div>
                    </div>
                `
            },
            {
                title: 'Review',
                content: `
                    <div class="form-section">
                        <h4 class="form-section-title">Review Your Application</h4>
                        <p style="color: var(--gray-600); margin-bottom: 20px;">Please review your information before submitting.</p>
                        
                        <div class="review-section">
                            <div class="review-section-title">
                                Business Information
                                <button type="button" class="review-section-edit" data-edit-step="0">Edit</button>
                            </div>
                            <div class="review-row">
                                <span class="review-label">Business Name</span>
                                <span class="review-value" id="reviewBusinessName">-</span>
                            </div>
                            <div class="review-row">
                                <span class="review-label">Business Type</span>
                                <span class="review-value" id="reviewBusinessType">-</span>
                            </div>
                        </div>
                        
                        <div class="review-section">
                            <div class="review-section-title">
                                Location
                                <button type="button" class="review-section-edit" data-edit-step="1">Edit</button>
                            </div>
                            <div class="review-row">
                                <span class="review-label">Barangay</span>
                                <span class="review-value" id="reviewBarangay">-</span>
                            </div>
                        </div>
                        
                        <div style="background: #eff6ff; border: 1px solid #93c5fd; border-radius: 8px; padding: 16px; margin-top: 20px;">
                            <div style="display: flex; align-items: center; gap: 8px; color: #1e40af; font-weight: 600; margin-bottom: 8px;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="16" x2="12" y2="12"></line>
                                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                </svg>
                                Declaration
                            </div>
                            <p style="color: #3b82f6; font-size: 0.875rem; line-height: 1.5;">
                                I hereby declare that all information provided is true and accurate.
                            </p>
                        </div>
                    </div>
                `
            }
        ];
        
        // Initialize wizard when DOM is ready
        if (typeof wizard !== 'undefined') {
            wizard.init('permitWizard', wizardSteps);
            
            // Add event listeners for edit buttons after wizard renders
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('review-section-edit')) {
                    const step = parseInt(e.target.dataset.editStep);
                    if (!isNaN(step) && wizard) {
                        wizard.showStep(step);
                    }
                }
            });
        }
        
        // Function to populate review step with form data
        function populateReviewStep() {
            const formData = wizard.collectData();
            
            // Map business type values to readable labels
            const businessTypeMap = {
                'sole_proprietorship': 'Sole Proprietorship',
                'partnership': 'Partnership',
                'corporation': 'Corporation',
                'cooperative': 'Cooperative'
            };
            
            // Populate review fields
            const reviewFields = {
                'reviewBusinessName': formData.businessName || '-',
                'reviewBusinessType': businessTypeMap[formData.businessType] || formData.businessType || '-',
                'reviewBarangay': formData.businessBarangay || '-'
            };
            
            Object.entries(reviewFields).forEach(([id, value]) => {
                const element = document.getElementById(id);
                if (element) {
                    element.textContent = value;
                }
            });
        }
        
        wizard.submit = async function() {
            // Validate all previous steps have data
            const formData = this.collectData();
            console.log('Form data collected:', formData);
            
            const requiredFields = ['businessName', 'businessType', 'businessBarangay'];
            const missingFields = requiredFields.filter(field => !formData[field] || !formData[field].trim());
            
            if (missingFields.length > 0) {
                console.error('Missing required fields:', missingFields);
                ui.toast.error(`Please fill in: ${missingFields.join(', ')}`);
                return;
            }
            
            this.isSubmitting = true;
            this.formData = formData;
            
            const submitBtn = document.querySelector('#wizardNext');
            if (submitBtn) {
                submitBtn.classList.add('btn-loading');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';
            }
            
            try {
                // Get current user for owner info
                const user = auth.getUser();
                
                const permitData = {
                    businessInfo: {
                        businessName: this.formData.businessName,
                        businessType: this.formData.businessType,
                        businessAddress: {
                            street: this.formData.businessAddress,
                            barangay: this.formData.businessBarangay,
                            municipality: 'Janiuay',
                            province: 'Iloilo'
                        },
                        businessNature: this.formData.businessActivities,
                        capitalization: Number(this.formData.capitalization),
                        grossSales: Number(this.formData.grossSales)
                    },
                    ownerInfo: {
                        firstName: user?.firstName || 'KK',
                        lastName: user?.lastName || 'User',
                        phone: this.formData.contactNumber,
                        email: this.formData.email
                    },
                    dtiNumber: this.formData.dtiNumber,
                    tin: this.formData.tin,
                    businessActivities: this.formData.businessActivities
                };
                
                const response = await api.createPermit(permitData);
                
                console.log('API Response:', response);
                
                if (response.success) {
                    const permitId = response.data.permit._id;
                    
                    // Upload documents if any
                    const filesToUpload = Object.entries(uploadedFiles);
                    if (filesToUpload.length > 0) {
                        const formData = new FormData();
                        const docTypes = {};
                        
                        filesToUpload.forEach(([docType, file], index) => {
                            formData.append('documents', file);
                            docTypes[file.name] = docType;
                        });
                        
                        formData.append('docTypes', JSON.stringify(docTypes));
                        
                        try {
                            await api.uploadDocuments(permitId, formData);
                            console.log('Documents uploaded successfully');
                        } catch (docError) {
                            console.error('Error uploading documents:', docError);
                            ui.toast.warning('Permit created but some documents failed to upload');
                        }
                    }
                    
                    localStorage.removeItem('wizard_progress');
                    localStorage.removeItem('documentChecklist');
                    this.showComplete();
                    ui.toast.success('Application submitted successfully!');
                } else {
                    console.error('API Error:', response.message, response.errors);
                    ui.toast.error(response.message || 'Failed to submit');
                    this.isSubmitting = false;
                    if (submitBtn) {
                        submitBtn.classList.remove('btn-loading');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Submit';
                    }
                }
            } catch (error) {
                console.error('Submit Error:', error);
                ui.toast.error(error.message || 'An error occurred');
                this.isSubmitting = false;
                if (submitBtn) {
                    submitBtn.classList.remove('btn-loading');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit';
                }
            }
        };
        
        // Initialize UI
        if (typeof ui !== 'undefined') {
            ui.init();
        }
        
        // Autofill feature for testing (Ctrl+Shift+F)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'F') {
                e.preventDefault();
                autofillTestData();
            }
        });
        
        function autofillTestData() {
            const fields = {
                'businessName': 'KK Trading Store',
                'businessType': 'sole_proprietorship',
                'dtiNumber': 'DTI-12345678',
                'tin': '123-456-789-000',
                'businessAddress': '123 Main Street, Poblacion, Janiuay, Iloilo',
                'businessBarangay': 'Poblacion',
                'contactNumber': '09123456789',
                'email': 'kk.trading@email.com',
                'capitalization': '150000',
                'grossSales': '500000',
                'businessActivities': 'Retail trading of general merchandise including household items, groceries, and personal care products.'
            };
            
            Object.entries(fields).forEach(([id, value]) => {
                const field = document.getElementById(id);
                if (field) {
                    field.value = value;
                    field.dispatchEvent(new Event('input', { bubbles: true }));
                    field.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
            
            // Calculate fees after autofill
            calculateFees();
            
            // Show toast notification
            if (typeof ui !== 'undefined' && ui.toast) {
                ui.toast.success('Test data autofilled for user KK! (Ctrl+Shift+F)');
            } else {
                console.log('Test data autofilled for user KK!');
            }
        }
        
        // Fee Calculator Function
        function calculateFees() {
            const capInput = document.getElementById('capitalization');
            if (!capInput) return;
            
            const capitalization = parseFloat(capInput.value) || 0;
            
            // Calculate Mayor's Permit Fee (progressive rate)
            let mayorsFee = 0;
            if (capitalization <= 50000) {
                mayorsFee = 500;
            } else if (capitalization <= 100000) {
                mayorsFee = 1000;
            } else if (capitalization <= 500000) {
                mayorsFee = 1500;
            } else if (capitalization <= 1000000) {
                mayorsFee = 2500;
            } else {
                mayorsFee = 5000;
            }
            
            // Calculate Business Tax (0.5% of gross sales estimate)
            const grossSalesInput = document.getElementById('grossSales');
            const grossSales = parseFloat(grossSalesInput?.value) || capitalization * 5;
            const businessTax = Math.round(grossSales * 0.005);
            
            // Fixed fees
            const sanitaryFee = 150;
            const fireFee = 100;
            const envFee = 50;
            
            const total = mayorsFee + businessTax + sanitaryFee + fireFee + envFee;
            
            // Update display
            const feeMayors = document.getElementById('feeMayors');
            const feeTax = document.getElementById('feeTax');
            const feeSanitary = document.getElementById('feeSanitary');
            const feeFire = document.getElementById('feeFire');
            const feeEnv = document.getElementById('feeEnv');
            const feeTotal = document.getElementById('feeTotal');
            
            if (feeMayors) feeMayors.textContent = '₱' + mayorsFee.toLocaleString();
            if (feeTax) feeTax.textContent = '₱' + businessTax.toLocaleString();
            if (feeSanitary) feeSanitary.textContent = '₱' + sanitaryFee.toLocaleString();
            if (feeFire) feeFire.textContent = '₱' + fireFee.toLocaleString();
            if (feeEnv) feeEnv.textContent = '₱' + envFee.toLocaleString();
            if (feeTotal) feeTotal.textContent = '₱' + total.toLocaleString();
        }
        
        // File Upload Manager
        const uploadedFiles = {};
        
        function initFileUploads() {
            // Add event listeners to all file inputs (only once)
            document.querySelectorAll('.file-input').forEach(input => {
                // Skip if already initialized
                if (input.dataset.initialized === 'true') return;
                input.dataset.initialized = 'true';
                
                const zone = input.closest('.upload-zone');
                const docType = input.dataset.doc;
                
                // Click to upload
                input.addEventListener('change', (e) => handleFileSelect(e, docType, zone));
                
                // Drag and drop
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('dragover');
                });
                
                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('dragover');
                });
                
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        handleFile(files[0], docType, zone);
                    }
                });
            });
        }
        
        function handleFileSelect(e, docType, zone) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file, docType, zone);
            }
        }
        
        function handleFile(file, docType, zone) {
            // Validate file size
            const maxSize = docType === 'signature' ? 2 * 1024 * 1024 : 5 * 1024 * 1024;
            if (file.size > maxSize) {
                ui.toast.error(`File too large. Max size: ${docType === 'signature' ? '2MB' : '5MB'}`);
                return;
            }
            
            // Validate file type
            const allowedTypes = docType === 'signature' 
                ? ['image/jpeg', 'image/png']
                : ['application/pdf', 'image/jpeg', 'image/png'];
            if (!allowedTypes.includes(file.type)) {
                ui.toast.error(`Invalid file type. Allowed: ${docType === 'signature' ? 'JPG, PNG' : 'PDF, JPG, PNG'}`);
                return;
            }
            
            // Store file
            uploadedFiles[docType] = file;
            
            // Update UI
            const placeholder = zone.querySelector('.upload-placeholder');
            const preview = zone.querySelector('.upload-preview');
            
            if (placeholder) placeholder.style.display = 'none';
            if (preview) {
                preview.classList.add('show');
                preview.innerHTML = `
                    ${file.type.startsWith('image/') ? `<img src="${URL.createObjectURL(file)}" class="upload-preview-img" alt="Preview">` : ''}
                    <div class="upload-preview-info">
                        <div class="upload-preview-name">${file.name}</div>
                        <div class="upload-preview-size">${formatFileSize(file.size)}</div>
                    </div>
                    <button type="button" class="upload-remove" data-doc="${docType}" aria-label="Remove file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                `;
            }
            
            zone.classList.add('uploaded');
            updateDocumentProgress();
            
            ui.toast.success(`${getDocName(docType)} uploaded successfully!`);
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function getDocName(docType) {
            const names = {
                'dti': 'DTI/SEC Registration',
                'id': 'Valid Government ID',
                'signature': 'E-Signature',
                'lease': 'Lease Contract/Land Title',
                'barangay': 'Barangay Clearance',
                'cedula': 'Cedula (CTC)'
            };
            return names[docType] || docType;
        }
        
        function updateDocumentProgress() {
            const requiredDocs = ['dti', 'id', 'signature', 'lease', 'barangay'];
            const uploadedCount = requiredDocs.filter(doc => uploadedFiles[doc]).length;
            const totalRequired = requiredDocs.length;
            
            const progressText = document.getElementById('docsProgress');
            const progressBar = document.getElementById('docsProgressBar');
            
            if (progressText) {
                progressText.textContent = `${uploadedCount}/${totalRequired} uploaded`;
            }
            if (progressBar) {
                progressBar.style.width = `${(uploadedCount / totalRequired) * 100}%`;
            }
            
            // Change color when complete
            if (uploadedCount === totalRequired && progressBar) {
                progressBar.style.background = 'var(--success)';
            }
        }
        
        // Handle remove file clicks
        document.addEventListener('click', (e) => {
            if (e.target.closest('.upload-remove')) {
                const btn = e.target.closest('.upload-remove');
                const docType = btn.dataset.doc;
                const zone = document.querySelector(`.upload-zone[data-doc="${docType}"]`);
                
                delete uploadedFiles[docType];
                
                if (zone) {
                    zone.classList.remove('uploaded');
                    const placeholder = zone.querySelector('.upload-placeholder');
                    const preview = zone.querySelector('.upload-preview');
                    const input = zone.querySelector('.file-input');
                    
                    if (placeholder) placeholder.style.display = 'flex';
                    if (preview) {
                        preview.classList.remove('show');
                        preview.innerHTML = '';
                    }
                    if (input) input.value = '';
                }
                
                updateDocumentProgress();
                ui.toast.info(`${getDocName(docType)} removed`);
            }
        });
        
        // Initialize file uploads after wizard renders
        if (typeof wizard !== 'undefined') {
            const originalShowStep = wizard.showStep;
            wizard.showStep = function(index) {
                originalShowStep.call(this, index);
                
                // Populate review step when showing step 4 (Review)
                if (index === 4) {
                    setTimeout(populateReviewStep, 50);
                }
                
                // Initialize file uploads when showing Documents step (step 3)
                if (index === 3) {
                    setTimeout(initFileUploads, 50);
                }
            };
        }
    </script>
</body>
</html>
