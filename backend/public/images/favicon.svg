<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Rich Blue Gradient -->
    <linearGradient id="sealBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <!-- Gold Accent Gradient -->
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <!-- Document White Gradient -->
    <linearGradient id="docWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Ring (Gold Border) -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#sealGold)" stroke-width="3"/>
  
  <!-- Inner Decorative Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 2"/>
  
  <!-- Main Background Circle -->
  <circle cx="50" cy="50" r="41" fill="url(#sealBlue)"/>
  
  <!-- Document Icon Background -->
  <rect x="30" y="25" width="40" height="50" rx="3" ry="3" fill="url(#docWhite)" filter="url(#shadow)"/>
  
  <!-- Document Folded Corner -->
  <path d="M65 25 L70 30 L65 30 Z" fill="#e5e7eb"/>
  <path d="M65 25 L70 30 L65 30 Z" fill="#d1d5db"/>
  
  <!-- Document Text Lines -->
  <rect x="35" y="38" width="22" height="2" rx="1" fill="#9ca3af"/>
  <rect x="35" y="44" width="30" height="2" rx="1" fill="#6b7280"/>
  <rect x="35" y="50" width="25" height="2" rx="1" fill="#6b7280"/>
  <rect x="35" y="56" width="28" height="2" rx="1" fill="#6b7280"/>
  
  <!-- Official Seal Stamp Circle -->
  <circle cx="58" cy="62" r="10" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="58" cy="62" r="7" fill="none" stroke="#dc2626" stroke-width="1"/>
  
  <!-- Checkmark -->
  <path d="M54 62 L57 65 L63 58" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter J at bottom -->
  <text x="50" y="88" 
        font-family="Georgia, serif" 
        font-size="14" 
        font-weight="bold" 
        fill="#fbbf24" 
        text-anchor="middle">JANI</text>
  
  <!-- Star decorations -->
  <polygon points="22,50 23,53 26,53 24,55 25,58 22,56 19,58 20,55 18,53 21,53" fill="#fbbf24"/>
  <polygon points="78,50 79,53 82,53 80,55 81,58 78,56 75,58 76,55 74,53 77,53" fill="#fbbf24"/>
</svg>
